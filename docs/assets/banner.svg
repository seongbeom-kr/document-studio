<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Document Studio</title>
  <desc id="desc">An embeddable HWPX and DOCX editor SDK for human and agent workflows.</desc>
